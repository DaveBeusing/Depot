name: Software quality gates

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master, compliance ]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-windows-2022:
    name: Windows Server 2022 compatibility smoke
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build with zero warnings
        run: dotnet build Depot.slnx --configuration Release --no-restore -warnaserror

      - name: Compatibility smoke - Depot
        run: >-
          dotnet test tests/Depot.Tests/Depot.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~DatabaseProviderTests|FullyQualifiedName~ApplicationStartupTests|FullyQualifiedName~ShellArchitectureRegressionTests"
          --blame-hang
          --blame-hang-timeout 8m
          --logger "console;verbosity=normal"

      - name: Compatibility smoke - DepotManager
        run: >-
          dotnet test tests/DepotManager.Tests/DepotManager.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~DepotManagerTests"
          --blame-hang
          --blame-hang-timeout 8m
          --logger "console;verbosity=normal"

  coverage:
    name: Coverage regression - ${{ matrix.area }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: Core
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Persistence
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Finance
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Security-Auth
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Sessions-Audit
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Audit-Integrity
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: DepotManager
            project: tests/DepotManager.Tests/DepotManager.Tests.csproj
          - area: Sales
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Purchasing
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Procurement-Receiving
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Supplier-Returns
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Inventory-Warehouse
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Inventory-Operations
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Shell-UX
            project: tests/Depot.Tests/Depot.Tests.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build test area
        run: dotnet build ${{ matrix.project }} --configuration Release --no-restore -warnaserror

      - name: Run regression area with production coverage
        shell: pwsh
        run: >-
          ./scripts/quality/run-test-area.ps1
          -Area '${{ matrix.area }}'
          -Configuration Release
          -NoBuild
          -Coverage
          -ResultsDirectory 'TestResults/Coverage/${{ matrix.area }}'

      - name: Upload area coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-${{ matrix.area }}
          path: TestResults/Coverage/${{ matrix.area }}/**/*.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  coverage-gate:
    name: Production coverage gate
    runs-on: windows-2025
    timeout-minutes: 10
    needs: coverage
    if: always()
    env:
      COVERAGE_MATRIX_RESULT: ${{ needs.coverage.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: code-coverage-*
          path: TestResults/Coverage
          merge-multiple: true

      - name: Enforce production code coverage
        shell: pwsh
        run: >-
          ./scripts/quality/assert-code-coverage.ps1
          -CoveragePath TestResults/Coverage
          -MinimumLinePercent 38
          -MinimumBranchPercent 39
          -MinimumDepotManagerLinePercent 22
          -MinimumDepotManagerBranchPercent 25

      - name: Require all coverage regressions to pass
        shell: pwsh
        run: |
          if ($env:COVERAGE_MATRIX_RESULT -ne 'success') {
            throw "Coverage regression matrix result was '$env:COVERAGE_MATRIX_RESULT'."
          }

  performance:
    name: 100k performance baseline
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build performance tests
        run: dotnet build tests/Depot.Tests/Depot.Tests.csproj --configuration Release --no-restore -warnaserror

      - name: Run 100k performance baseline
        run: >-
          dotnet test tests/Depot.Tests/Depot.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "QualityGate=Performance"
          --blame-hang
          --blame-hang-timeout 10m
          --logger "console;verbosity=normal"

  accessibility-static:
    name: Accessibility technical baseline
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify desktop accessibility technical baseline
        shell: pwsh
        run: ./scripts/quality/test-accessibility.ps1 -EvidencePath artifacts/accessibility/TechnicalAccessibilityEvidence.json

      - name: Validate manual acceptance evidence contract
        shell: pwsh
        run: ./scripts/operations/Test-AccessibilityAcceptance.ps1

      - name: Upload accessibility technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-technical-evidence
          path: artifacts/accessibility/TechnicalAccessibilityEvidence.json
          if-no-files-found: warn
          retention-days: 30

  required:
    name: Quality Required Gate
    if: always()
    needs:
      - compatibility-windows-2022
      - coverage-gate
      - performance
      - accessibility-static
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require all quality gates to pass
        shell: pwsh
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility-windows-2022.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          ACCESSIBILITY_RESULT: ${{ needs.accessibility-static.result }}
        run: |
          $failed = @()
          if ($env:COMPATIBILITY_RESULT -ne 'success') { $failed += "compatibility=$env:COMPATIBILITY_RESULT" }
          if ($env:COVERAGE_RESULT -ne 'success') { $failed += "coverage=$env:COVERAGE_RESULT" }
          if ($env:PERFORMANCE_RESULT -ne 'success') { $failed += "performance=$env:PERFORMANCE_RESULT" }
          if ($env:ACCESSIBILITY_RESULT -ne 'success') { $failed += "accessibility-static=$env:ACCESSIBILITY_RESULT" }
          if ($failed.Count -gt 0) {
            throw "Quality required gate failed: $($failed -join ', ')."
          }
