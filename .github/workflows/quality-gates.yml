name: Software quality gates

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master, compliance ]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Windows compatibility - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build with zero warnings
        run: dotnet build Depot.slnx --configuration Release --no-restore -warnaserror

      - name: Windows Server 2022 compatibility smoke - Depot
        if: matrix.os == 'windows-2022'
        run: >-
          dotnet test tests/Depot.Tests/Depot.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~DatabaseProviderTests|FullyQualifiedName~ApplicationStartupTests|FullyQualifiedName~ShellArchitectureRegressionTests"
          --blame-hang
          --blame-hang-timeout 8m
          --logger "console;verbosity=normal"

      - name: Windows Server 2022 compatibility smoke - DepotManager
        if: matrix.os == 'windows-2022'
        run: >-
          dotnet test tests/DepotManager.Tests/DepotManager.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~DepotManagerTests"
          --blame-hang
          --blame-hang-timeout 8m
          --logger "console;verbosity=normal"

  regression:
    name: Regression - ${{ matrix.area }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: Core
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Persistence
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Finance
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Security-Auth
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Sessions-Audit
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: DepotManager
            project: tests/DepotManager.Tests/DepotManager.Tests.csproj
          - area: Sales
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Purchasing
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Inventory-Warehouse
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Shell-UX
            project: tests/Depot.Tests/Depot.Tests.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build test area
        run: dotnet build ${{ matrix.project }} --configuration Release --no-restore -warnaserror

      - name: Run regression area
        shell: pwsh
        run: ./scripts/quality/run-test-area.ps1 -Area '${{ matrix.area }}' -Configuration Release -NoBuild

  coverage:
    name: Production code coverage
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build with zero warnings
        run: dotnet build Depot.slnx --configuration Release --no-restore -warnaserror

      - name: Run regression suite with production coverage
        run: >-
          dotnet test Depot.slnx
          --configuration Release
          --no-build
          --no-restore
          --filter "QualityGate!=Performance"
          --blame-hang
          --blame-hang-timeout 10m
          --logger "console;verbosity=normal"
          --settings tests/coverage.runsettings
          --collect "Code Coverage"
          --results-directory TestResults/Coverage

      - name: Evaluate code coverage baseline
        shell: pwsh
        run: >-
          ./scripts/quality/assert-code-coverage.ps1
          -CoveragePath TestResults/Coverage
          -MinimumLinePercent 0
          -MinimumBranchPercent 0
          -MinimumDepotManagerLinePercent 0
          -MinimumDepotManagerBranchPercent 0

      - name: Upload code coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-cobertura
          path: TestResults/Coverage/**/*.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  performance:
    name: 100k performance baseline
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build performance tests
        run: dotnet build tests/Depot.Tests/Depot.Tests.csproj --configuration Release --no-restore -warnaserror

      - name: Run 100k performance baseline
        run: >-
          dotnet test tests/Depot.Tests/Depot.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "QualityGate=Performance"
          --blame-hang
          --blame-hang-timeout 10m
          --logger "console;verbosity=normal"

  accessibility-static:
    name: Accessibility static baseline
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify desktop accessibility baseline
        shell: pwsh
        run: ./scripts/quality/test-accessibility.ps1
