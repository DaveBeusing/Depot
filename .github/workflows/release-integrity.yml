name: Depot release pipeline

on:
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/release-integrity.yml'
      - 'scripts/publish-packaged-artifacts.ps1'
      - 'scripts/release.ps1'
      - 'src/Depot/**'
      - 'src/DepotManager/**'
      - 'tests/DepotManager.Tests/**'
      - 'Directory.Build.props'
      - 'security/security-risk-acceptances.json'
      - 'scripts/security/validate-risk-acceptances.ps1'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - Preview
          - Stable

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  release-candidate:
    name: Build release candidate
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      tag: ${{ steps.identity.outputs.tag }}
      depot-version: ${{ steps.identity.outputs.depot-version }}
      manager-version: ${{ steps.identity.outputs.manager-version }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source identity
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') {
            throw "Checkout SHA $head does not match workflow SHA ${{ github.sha }}."
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            if ('${{ github.ref }}' -ne 'refs/heads/master') {
              throw 'Release publication is allowed only from master.'
            }
            git fetch origin master --no-tags
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $remoteMaster = (git rev-parse origin/master).Trim()
            if ($remoteMaster -ne $head) {
              throw "Release source $head is not the current origin/master $remoteMaster."
            }
          }

      - name: Resolve release identity
        id: identity
        shell: pwsh
        run: |
          $channel = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.channel }}' } else { 'Preview' }
          if ($channel -notin @('Preview', 'Stable')) {
            throw "Unsupported release channel '$channel'."
          }

          [xml]$depotProps = Get-Content Directory.Build.props
          $depot = $depotProps.Project.PropertyGroup | Select-Object -First 1
          $depotVersion = "$($depot.DepotVersionMajor).$($depot.DepotVersionMinor).$($depot.DepotVersionPatch)"
          $suffix = [string]$depot.DepotVersionSuffix
          if ([string]::IsNullOrWhiteSpace($suffix)) {
            throw 'DepotVersionSuffix must be configured.'
          }

          [xml]$managerProps = Get-Content src/DepotManager/DepotManager.Version.props
          $manager = $managerProps.Project.PropertyGroup | Select-Object -First 1
          $managerVersion = "$($manager.DepotManagerVersionMajor).$($manager.DepotManagerVersionMinor).$($manager.DepotManagerVersionPatch)"

          $tag = if ($channel -eq 'Preview') { "$depotVersion-$suffix" } else { $depotVersion }

          "DEPOT_RELEASE_CHANNEL=$channel" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DEPOT_VERSION=$depotVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DEPOT_MANAGER_VERSION=$managerVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DEPOT_RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "channel=$channel" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "depot-version=$depotVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manager-version=$managerVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate security risk acceptances
        shell: pwsh
        run: ./scripts/security/validate-risk-acceptances.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore Depot.slnx --locked-mode -p:AuditPipeline=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/Depot/Depot.csproj --runtime win-x64 -p:AuditPipeline=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/DepotManager/DepotManager.csproj --runtime win-x64 -p:AuditPipeline=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release warning-free
        run: dotnet build Depot.slnx --configuration Release --no-restore -warnaserror -p:AuditPipeline=true

      - name: Run Depot regression suite
        run: >-
          dotnet test tests/Depot.Tests/Depot.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --blame-hang
          --blame-hang-timeout 10m
          --logger "trx;LogFileName=Depot.Release.trx"
          --results-directory artifacts/test-results

      - name: Run DepotManager regression suite
        run: >-
          dotnet test tests/DepotManager.Tests/DepotManager.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --blame-hang
          --blame-hang-timeout 10m
          --logger "trx;LogFileName=DepotManager.Release.trx"
          --results-directory artifacts/test-results

      - name: Publish packaged artifacts
        shell: pwsh
        run: ./scripts/publish-packaged-artifacts.ps1 -OutputRoot artifacts/release -NoRestore -Channel $env:DEPOT_RELEASE_CHANNEL

      - name: Validate packaged channel and versions
        shell: pwsh
        run: |
          $depotInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'artifacts/release/depot/Depot.exe'))
          $managerInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'artifacts/release/manager/DepotManager.exe'))

          if ([Version]$depotInfo.FileVersion -ne [Version]"$env:DEPOT_VERSION.0") {
            throw "Depot.exe file version $($depotInfo.FileVersion) does not match configured version $env:DEPOT_VERSION."
          }
          if ([Version]$managerInfo.FileVersion -ne [Version]"$env:DEPOT_MANAGER_VERSION.0") {
            throw "DepotManager.exe file version $($managerInfo.FileVersion) does not match configured version $env:DEPOT_MANAGER_VERSION."
          }

          if ($env:DEPOT_RELEASE_CHANNEL -eq 'Preview') {
            if ($depotInfo.ProductVersion -notmatch '-preview' -or $managerInfo.ProductVersion -notmatch '-preview') {
              throw 'Preview artifacts must retain their preview version suffix.'
            }
          }
          else {
            if ($depotInfo.ProductVersion -match '-preview' -or $managerInfo.ProductVersion -match '-preview') {
              throw 'Stable artifacts must not contain the preview version suffix.'
            }
          }

      - name: Apply signing policy
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.DEPOT_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.DEPOT_SIGNING_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PFX)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)
          if ($hasPfx -ne $hasPassword) {
            throw 'Signing configuration is incomplete: both DEPOT_SIGNING_PFX_BASE64 and DEPOT_SIGNING_PASSWORD are required together.'
          }

          if ($env:DEPOT_RELEASE_CHANNEL -eq 'Stable' -and -not $hasPfx) {
            throw 'Stable releases require production Authenticode signing credentials. Release blocked.'
          }

          if (-not $hasPfx) {
            'DEPOT_RELEASE_SIGNED=false' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'Preview release candidate remains unsigned because no signing credentials are configured.'
            exit 0
          }

          $certificate = Join-Path $env:RUNNER_TEMP 'depot-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_PFX))
          try {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signtool) { throw 'signtool.exe was not found on the runner.' }

            foreach ($file in @('artifacts\release\depot\Depot.exe', 'artifacts\release\manager\DepotManager.exe')) {
              & $signtool.FullName sign /fd SHA256 /f $certificate /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $file." }
              & $signtool.FullName verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $file." }
            }
          }
          finally {
            Remove-Item $certificate -Force -ErrorAction SilentlyContinue
          }

          'DEPOT_RELEASE_SIGNED=true' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage manifest, hashes and release evidence
        shell: pwsh
        run: |
          function Read-CurrentVersion([string]$Path) {
            $match = Select-String -Path $Path -Pattern 'CurrentVersion\s*=\s*(\d+)' | Select-Object -First 1
            if ($null -eq $match -or $match.Matches.Count -eq 0) {
              throw "CurrentVersion could not be determined from $Path."
            }
            return [int]$match.Matches[0].Groups[1].Value
          }

          $schemas = [ordered]@{
            core = Read-CurrentVersion 'src/Depot/Data/DatabaseVersion.cs'
            sales = Read-CurrentVersion 'src/Depot/Data/SalesSchemaMigration.cs'
            finance = Read-CurrentVersion 'src/Depot/Data/FinanceInventoryAccountingSchemaMigration.cs'
            userSessions = Read-CurrentVersion 'src/Depot/Data/UserSessionSchemaMigration.cs'
            securityEvents = Read-CurrentVersion 'src/Depot/Data/SecurityEventSchemaMigration.cs'
          }

          $assets = 'artifacts/release/assets'
          New-Item -ItemType Directory -Force $assets | Out-Null
          $depotName = "Depot-$env:DEPOT_VERSION.exe"
          $managerName = "DepotManager-$env:DEPOT_MANAGER_VERSION.exe"
          $manifestName = "Depot-$env:DEPOT_VERSION.manifest.json"
          Copy-Item 'artifacts/release/depot/Depot.exe' (Join-Path $assets $depotName)
          Copy-Item 'artifacts/release/manager/DepotManager.exe' (Join-Path $assets $managerName)

          $depotFile = Get-Item (Join-Path $assets $depotName)
          $managerFile = Get-Item (Join-Path $assets $managerName)
          $depotHash = (Get-FileHash $depotFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $managerHash = (Get-FileHash $managerFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $signed = $env:DEPOT_RELEASE_SIGNED -eq 'true'
          $channelText = $env:DEPOT_RELEASE_CHANNEL.ToLowerInvariant()

          $manifest = [ordered]@{
            formatVersion = 2
            releaseChannel = $channelText
            releaseTag = $env:DEPOT_RELEASE_TAG
            sourceSha = '${{ github.sha }}'
            depotVersion = $env:DEPOT_VERSION
            depotManagerVersion = $env:DEPOT_MANAGER_VERSION
            databaseSchemaVersion = $schemas.core
            schemaVersions = $schemas
            managerCommandProtocol = 1
            artifacts = [ordered]@{
              depot = [ordered]@{
                file = $depotName
                size = $depotFile.Length
                sha256 = $depotHash
                authenticodeSigned = $signed
              }
              depotManager = [ordered]@{
                file = $managerName
                size = $managerFile.Length
                sha256 = $managerHash
                authenticodeSigned = $signed
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Out-File (Join-Path $assets $manifestName) -Encoding utf8

          $evidence = [ordered]@{
            formatVersion = 1
            sourceSha = '${{ github.sha }}'
            sourceRef = '${{ github.ref }}'
            workflowRunId = '${{ github.run_id }}'
            releaseChannel = $channelText
            releaseTag = $env:DEPOT_RELEASE_TAG
            depotVersion = $env:DEPOT_VERSION
            depotManagerVersion = $env:DEPOT_MANAGER_VERSION
            schemaVersions = $schemas
            authenticodeSigned = $signed
            artifactHashes = [ordered]@{
              $depotName = $depotHash
              $managerName = $managerHash
            }
          }
          $evidence | ConvertTo-Json -Depth 8 | Out-File (Join-Path $assets 'ReleaseEvidence.json') -Encoding utf8
          Copy-Item security/security-risk-acceptances.json (Join-Path $assets 'security-risk-acceptances.json')

          Get-ChildItem $assets -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash.ToLowerInvariant()) *$($_.Name)"
            } | Out-File (Join-Path $assets 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload immutable release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: depot-release-${{ github.sha }}
          path: artifacts/release/assets/
          if-no-files-found: error
          retention-days: 90

      - name: Upload release test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depot-release-tests-${{ github.sha }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 90

  publish-release:
    name: Publish GitHub release
    needs: release-candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download exact release candidate
        uses: actions/download-artifact@v4
        with:
          name: depot-release-${{ github.sha }}
          path: artifacts/release

      - name: Verify release candidate identity
        shell: pwsh
        run: |
          $evidence = Get-Content artifacts/release/ReleaseEvidence.json -Raw | ConvertFrom-Json
          if ($evidence.sourceSha -ne '${{ github.sha }}') {
            throw "Evidence source SHA $($evidence.sourceSha) does not match workflow SHA ${{ github.sha }}."
          }
          if ($evidence.releaseTag -ne '${{ needs.release-candidate.outputs.tag }}') {
            throw 'Release evidence tag does not match the resolved release tag.'
          }
          if ($evidence.releaseChannel -ne '${{ needs.release-candidate.outputs.channel }}'.ToLowerInvariant()) {
            throw 'Release evidence channel does not match the requested release channel.'
          }

      - name: Ensure tag and release do not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.release-candidate.outputs.tag }}'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub release '$tag' already exists."
          }

          gh api "repos/${{ github.repository }}/git/ref/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Git tag '$tag' already exists without an authoritative release."
          }

      - name: Publish release from validated artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.release-candidate.outputs.tag }}'
          $channel = '${{ needs.release-candidate.outputs.channel }}'
          $arguments = @(
            'release', 'create', $tag,
            '--repo', '${{ github.repository }}',
            '--target', '${{ github.sha }}',
            '--title', $tag,
            '--generate-notes'
          )
          if ($channel -eq 'Preview') {
            $arguments += '--prerelease'
          }

          $files = Get-ChildItem artifacts/release -File | Sort-Object Name | ForEach-Object FullName
          if ($files.Count -eq 0) { throw 'No validated release assets were downloaded.' }
          $arguments += $files

          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify published channel and source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.release-candidate.outputs.tag }}'
          $release = gh release view $tag --repo '${{ github.repository }}' --json tagName,isPrerelease,isDraft,targetCommitish | ConvertFrom-Json
          if ($release.isDraft) { throw 'Published release unexpectedly remained a draft.' }
          $expectedPrerelease = '${{ needs.release-candidate.outputs.channel }}' -eq 'Preview'
          if ([bool]$release.isPrerelease -ne $expectedPrerelease) {
            throw 'Published GitHub release channel does not match the requested channel.'
          }
          if ($release.tagName -ne $tag) { throw 'Published release tag does not match the resolved tag.' }
          if ($release.targetCommitish -ne '${{ github.sha }}') {
            throw "Published release target $($release.targetCommitish) does not match source ${{ github.sha }}."
          }
