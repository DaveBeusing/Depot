name: Release integrity

on:
  push:
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/release-integrity.yml'
      - 'src/Depot/**'
      - 'src/DepotManager/**'
      - 'Directory.Build.props'
      - 'security/security-risk-acceptances.json'
      - 'scripts/security/validate-risk-acceptances.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source identity
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne '${{ github.sha }}') { throw "Checkout SHA $head does not match workflow SHA ${{ github.sha }}" }
          "commit=$head" | Out-File artifacts-source.txt -Encoding ascii
          "ref=${{ github.ref }}" | Add-Content artifacts-source.txt -Encoding ascii

      - name: Validate security risk acceptances
        shell: pwsh
        run: ./scripts/security/validate-risk-acceptances.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode -p:AuditPipeline=true

      - name: Restore win-x64 runtimes
        shell: pwsh
        run: |
          dotnet restore src/Depot/Depot.csproj --runtime win-x64 -p:AuditPipeline=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/DepotManager/DepotManager.csproj --runtime win-x64 -p:AuditPipeline=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release artifacts
        shell: pwsh
        run: |
          dotnet publish src/Depot/Depot.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/release/depot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/DepotManager/DepotManager.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/release/manager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate independent Depot Manager version
        shell: pwsh
        run: |
          [xml]$managerVersionProps = Get-Content src/DepotManager/DepotManager.Version.props
          $properties = $managerVersionProps.Project.PropertyGroup
          $managerVersion = "$($properties.DepotManagerVersionMajor).$($properties.DepotManagerVersionMinor).$($properties.DepotManagerVersionPatch)"
          $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'artifacts/release/manager/DepotManager.exe')).FileVersion
          if ([Version]$fileVersion -ne [Version]"$managerVersion.0") { throw "DepotManager.exe file version $fileVersion does not match configured Depot Manager version $managerVersion." }
          "managerVersion=$managerVersion" | Add-Content artifacts-source.txt -Encoding ascii

      - name: Require signing credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.DEPOT_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.DEPOT_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) { throw 'Tagged production releases require DEPOT_SIGNING_PFX_BASE64 and DEPOT_SIGNING_PASSWORD repository secrets.' }

      - name: Authenticode sign executables
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.DEPOT_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.DEPOT_SIGNING_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'depot-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_PFX))
          try {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signtool) { throw 'signtool.exe was not found on the runner.' }
            foreach ($file in @('artifacts\release\depot\Depot.exe','artifacts\release\manager\DepotManager.exe')) {
              & $signtool.FullName sign /fd SHA256 /f $certificate /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $file." }
              & $signtool.FullName verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $file." }
            }
          }
          finally { Remove-Item $certificate -Force -ErrorAction SilentlyContinue }

      - name: Stage named release assets
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq '${{ github.ref_name }}' -and '${{ github.event_name }}' -eq 'pull_request') {
            $version = (Get-Content Directory.Build.props | Select-String '<VersionPrefix>').Line -replace '.*<VersionPrefix>|</VersionPrefix>.*',''
            if ($version -like '*$(*') { $version = 'ci' }
          }
          [xml]$managerVersionProps = Get-Content src/DepotManager/DepotManager.Version.props
          $properties = $managerVersionProps.Project.PropertyGroup
          $managerVersion = "$($properties.DepotManagerVersionMajor).$($properties.DepotManagerVersionMinor).$($properties.DepotManagerVersionPatch)"
          New-Item -ItemType Directory -Force artifacts/release/assets | Out-Null
          Copy-Item artifacts/release/depot/Depot.exe "artifacts/release/assets/Depot-$version.exe"
          Copy-Item artifacts/release/manager/DepotManager.exe artifacts/release/assets/DepotManager.exe
          Copy-Item artifacts/release/manager/DepotManager.exe "artifacts/release/assets/DepotManager-$managerVersion.exe"

      - name: Create integrity manifest
        shell: pwsh
        run: |
          Copy-Item artifacts-source.txt artifacts/release/source.txt
          Copy-Item security/security-risk-acceptances.json artifacts/release/security-risk-acceptances.json
          Get-ChildItem artifacts/release/assets -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant()) *assets/$($_.Name)"
          } | Out-File artifacts/release/SHA256SUMS.txt -Encoding ascii

      - name: Upload release integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: depot-release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90
