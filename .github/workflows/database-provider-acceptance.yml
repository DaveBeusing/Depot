name: Database Provider Acceptance

on:
  pull_request:
    branches: [ master ]
  push:
    branches:
      - master
      - 'database-provider-*'
      - 'production-operations-*'
  workflow_dispatch:

concurrency:
  group: provider-acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: SQLite reference baseline
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Release build
        run: dotnet build Depot.slnx --configuration Release --no-restore -warnaserror

      - name: Run SQLite provider acceptance
        shell: pwsh
        run: >-
          dotnet test tests/Depot.Tests/Depot.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "Acceptance=DatabaseProvider&Provider=SQLite"
          --logger "console;verbosity=normal"

      - name: Run isolated SQLite recovery drill
        id: sqlite-recovery
        shell: pwsh
        run: >-
          dotnet test tests/DepotManager.Tests/DepotManager.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~OperationalRecoveryTests.SqliteRecoveryDrill_RestoresVerifiedCopyAndReportsSchema"
          --logger "console;verbosity=normal"

      - name: Record SQLite recovery evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/recovery | Out-Null
          [ordered]@{
            formatVersion = 1
            provider = 'SQLite'
            result = if ('${{ steps.sqlite-recovery.outcome }}' -eq 'success') { 'PASS' } else { 'FAIL' }
            drill = 'isolated backup copy + SHA-256 + PRAGMA integrity_check + Depot schema metadata'
            sourceSha = '${{ github.sha }}'
            databaseIdentityRetained = $false
            credentialsRetained = $false
            generatedUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json | Set-Content artifacts/recovery/SQLite.json -Encoding utf8

      - name: Upload SQLite recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-drill-sqlite-${{ github.sha }}
          path: artifacts/recovery/SQLite.json
          if-no-files-found: error
          retention-days: 90

  remote:
    name: ${{ matrix.name }} - ${{ github.event_name == 'pull_request' && 'Smoke+Recovery' || 'Full' }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: SqlServer
            trait: SqlServer
            name: SQL Server 2022 Express
          - provider: MariaDB
            trait: MariaDB
            name: MariaDB 11.8 LTS
          - provider: MySQL
            trait: MySQL
            name: MySQL 8.4 LTS
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Release build
        run: dotnet build Depot.slnx --configuration Release --no-restore -warnaserror

      - name: Provision real ${{ matrix.name }} server
        shell: pwsh
        run: ./scripts/ci/Initialize-ProviderAcceptanceDatabase.ps1 -Provider '${{ matrix.provider }}'

      - name: Run critical provider smoke
        shell: pwsh
        run: |
          $filter = "Acceptance=DatabaseProvider&Provider=${{ matrix.trait }}&(AcceptanceLevel=Smoke|FullyQualifiedName~ProcurementProviderTests)"
          dotnet test tests/Depot.Tests/Depot.Tests.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter $filter `
            --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restart database server
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./scripts/ci/Restart-ProviderAcceptanceDatabase.ps1

      - name: Verify recovery after server restart
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $filter = "Acceptance=DatabaseProvider&Provider=${{ matrix.trait }}&AcceptanceLevel=Smoke"
          dotnet test tests/Depot.Tests/Depot.Tests.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter $filter `
            --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native backup and restore drill
        id: remote-recovery
        shell: pwsh
        run: ./scripts/ci/Invoke-ProviderRestoreAcceptance.ps1 -Provider '${{ matrix.provider }}' -EvidencePath 'artifacts/recovery/${{ matrix.provider }}.json'

      - name: Upload provider recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-drill-${{ matrix.provider }}-${{ github.sha }}
          path: artifacts/recovery/${{ matrix.provider }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify Depot recognizes restored database
        shell: pwsh
        run: |
          $filter = "Acceptance=DatabaseProvider&Provider=${{ matrix.trait }}&AcceptanceLevel=Smoke"
          dotnet test tests/Depot.Tests/Depot.Tests.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter $filter `
            --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full provider production matrix
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $filter = "Acceptance=DatabaseProvider&Provider=${{ matrix.trait }}"
          dotnet test tests/Depot.Tests/Depot.Tests.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter $filter `
            --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  required:
    name: Database Provider Required Gate
    if: always()
    needs:
      - sqlite
      - remote
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require provider acceptance to pass
        shell: pwsh
        env:
          SQLITE_RESULT: ${{ needs.sqlite.result }}
          REMOTE_RESULT: ${{ needs.remote.result }}
        run: |
          $failed = @()
          if ($env:SQLITE_RESULT -ne 'success') { $failed += "sqlite=$env:SQLITE_RESULT" }
          if ($env:REMOTE_RESULT -ne 'success') { $failed += "remote=$env:REMOTE_RESULT" }
          if ($failed.Count -gt 0) {
            throw "Database provider required gate failed: $($failed -join ', ')."
          }
