name: Electronic invoice conformance

on:
  push:
    branches: [ master, compliance ]
    paths:
      - 'src/Depot/Models/ElectronicInvoice.cs'
      - 'src/Depot/Models/HybridElectronicInvoice.cs'
      - 'src/Depot/Data/SalesSchemaMigration.cs'
      - 'src/Depot/Data/ZugferdFacturXSchema.cs'
      - 'src/Depot/Services/ElectronicInvoiceService.cs'
      - 'src/Depot/Services/SalesInvoiceFinalizationService.cs'
      - 'src/Depot/Services/SalesCreditNoteFinalizationService.cs'
      - 'src/Depot/Services/ZugferdFacturXService.cs'
      - 'tests/Depot.Tests/ElectronicInvoiceTests.cs'
      - 'tests/Depot.Tests/ElectronicInvoiceConformanceFixtureTests.cs'
      - 'tests/Depot.Tests/ZugferdFacturXTests.cs'
      - 'tests/Depot.Tests/SalesInvoiceFinalizationTests.cs'
      - 'tests/Depot.Tests/SalesFeatureTests.cs'
      - 'tests/Depot.Tests/Fixtures/ElectronicInvoice/**'
      - 'scripts/einvoice/**'
      - '.github/workflows/electronic-invoice-conformance.yml'
  pull_request:
    paths:
      - 'src/Depot/Models/ElectronicInvoice.cs'
      - 'src/Depot/Models/HybridElectronicInvoice.cs'
      - 'src/Depot/Data/SalesSchemaMigration.cs'
      - 'src/Depot/Data/ZugferdFacturXSchema.cs'
      - 'src/Depot/Services/ElectronicInvoiceService.cs'
      - 'src/Depot/Services/SalesInvoiceFinalizationService.cs'
      - 'src/Depot/Services/SalesCreditNoteFinalizationService.cs'
      - 'src/Depot/Services/ZugferdFacturXService.cs'
      - 'tests/Depot.Tests/ElectronicInvoiceTests.cs'
      - 'tests/Depot.Tests/ElectronicInvoiceConformanceFixtureTests.cs'
      - 'tests/Depot.Tests/ZugferdFacturXTests.cs'
      - 'tests/Depot.Tests/SalesInvoiceFinalizationTests.cs'
      - 'tests/Depot.Tests/SalesFeatureTests.cs'
      - 'tests/Depot.Tests/Fixtures/ElectronicInvoice/**'
      - 'scripts/einvoice/**'
      - '.github/workflows/electronic-invoice-conformance.yml'

permissions:
  contents: read

jobs:
  validate-xrechnung:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore tests/Depot.Tests/Depot.Tests.csproj --locked-mode -p:AuditPipeline=true
      - name: Verify generator-bound conformance fixtures
        shell: pwsh
        run: dotnet test tests/Depot.Tests/Depot.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~ElectronicInvoiceConformanceFixtureTests" -warnaserror
      - name: Verify ZUGFeRD/Factur-X hybrid packaging contract
        shell: pwsh
        run: dotnet test tests/Depot.Tests/Depot.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~ZugferdFacturXTests" -warnaserror
      - name: Validate advertised XRechnung CII matrix
        shell: pwsh
        run: ./scripts/einvoice/validate-xrechnung.ps1
