name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    name: Build and publish
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build
        run: dotnet build Depot.slnx --configuration Release --no-restore -warnaserror

      - name: Validate disaster recovery profile contract
        shell: pwsh
        run: ./scripts/operations/Test-DisasterRecoveryProfile.ps1 -ProfilePath operations/DisasterRecoveryProfile.example.json -AllowTemplate -EvidencePath artifacts/operations/DisasterRecoveryProfile.validation.json

      - name: Validate Track A acceptance closure contract
        shell: pwsh
        run: ./scripts/operations/Test-TrackAAcceptance.ps1 -Path operations/TrackAAcceptance.example.json -EvidencePath artifacts/operations/TrackAAcceptance.validation.json

      - name: Validate repository governance contract
        shell: pwsh
        run: ./scripts/operations/Test-RepositoryGovernance.ps1 -EvidencePath artifacts/operations/RepositoryGovernance.validation.json

      - name: Restore win-x64 runtimes
        shell: pwsh
        run: |
          dotnet restore src/Depot/Depot.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/DepotManager/DepotManager.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Depot
        run: >-
          dotnet publish src/Depot/Depot.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish/depot

      - name: Publish DepotManager
        run: >-
          dotnet publish src/DepotManager/DepotManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish/manager

      - name: Upload DR profile contract evidence
        uses: actions/upload-artifact@v7
        with:
          name: disaster-recovery-profile-contract-${{ github.sha }}
          path: artifacts/operations/DisasterRecoveryProfile.validation.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Track A closure contract evidence
        uses: actions/upload-artifact@v7
        with:
          name: track-a-closure-contract-${{ github.sha }}
          path: artifacts/operations/TrackAAcceptance.validation.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload repository governance contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-governance-contract-${{ github.sha }}
          path: artifacts/operations/RepositoryGovernance.validation.json
          if-no-files-found: error
          retention-days: 90

  test:
    name: Tests - ${{ matrix.area }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: Core
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Persistence
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Finance
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Security-Auth
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Sessions-Audit
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Audit-Integrity
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: DepotManager
            project: tests/DepotManager.Tests/DepotManager.Tests.csproj
          - area: Sales
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Purchasing
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Procurement-Receiving
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Supplier-Returns
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Inventory-Warehouse
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Inventory-Operations
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Shell-UX
            project: tests/Depot.Tests/Depot.Tests.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build test area
        run: dotnet build ${{ matrix.project }} --configuration Release --no-restore -warnaserror

      - name: Run regression area
        shell: pwsh
        run: ./scripts/quality/run-test-area.ps1 -Area '${{ matrix.area }}' -Configuration Release -NoBuild

  required:
    name: CI Required Gate
    if: always()
    needs:
      - build-publish
      - test
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to pass
        shell: pwsh
        env:
          BUILD_PUBLISH_RESULT: ${{ needs.build-publish.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          $failed = @()
          if ($env:BUILD_PUBLISH_RESULT -ne 'success') { $failed += "build-publish=$env:BUILD_PUBLISH_RESULT" }
          if ($env:TEST_RESULT -ne 'success') { $failed += "test=$env:TEST_RESULT" }
          if ($failed.Count -gt 0) {
            throw "CI required gate failed: $($failed -join ', ')."
          }
