name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build
        run: dotnet build Depot.slnx --configuration Release --no-restore

      - name: Restore win-x64 runtime
        run: dotnet restore src/Depot/Depot.csproj --runtime win-x64

      - name: Release single-file publish
        run: >-
          dotnet publish src/Depot/Depot.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish/win-x64

  test:
    name: Tests - ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Sales
            filter: FullyQualifiedName~Sales
          - name: Inventory-Warehouse
            filter: FullyQualifiedName~Inventory|FullyQualifiedName~StockTransfer|FullyQualifiedName~MaterialIssue|FullyQualifiedName~MaterialReturn|FullyQualifiedName~Shipment
          - name: Purchasing
            filter: FullyQualifiedName~Purchase|FullyQualifiedName~GoodsReceipt|FullyQualifiedName~SupplierReturn|FullyQualifiedName~Procurement
          - name: Shell-UX
            filter: FullyQualifiedName~Shell|FullyQualifiedName~Navigation|FullyQualifiedName~Help|FullyQualifiedName~Notification|FullyQualifiedName~ApplicationInformation
          - name: Core-Persistence
            filter: FullyQualifiedName!~Sales&FullyQualifiedName!~Inventory&FullyQualifiedName!~StockTransfer&FullyQualifiedName!~MaterialIssue&FullyQualifiedName!~MaterialReturn&FullyQualifiedName!~Shipment&FullyQualifiedName!~Purchase&FullyQualifiedName!~GoodsReceipt&FullyQualifiedName!~SupplierReturn&FullyQualifiedName!~Procurement&FullyQualifiedName!~Shell&FullyQualifiedName!~Navigation&FullyQualifiedName!~Help&FullyQualifiedName!~Notification&FullyQualifiedName!~ApplicationInformation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build tests
        run: dotnet build tests/Depot.Tests/Depot.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Depot.Tests/Depot.Tests.csproj --configuration Release --no-build --filter "${{ matrix.filter }}" --blame-hang --blame-hang-timeout 8m --logger "console;verbosity=normal"
