name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - ui2

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Depot.slnx

      - name: Build
        run: dotnet build Depot.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Depot.Tests/Depot.Tests.csproj --configuration Release --no-build
