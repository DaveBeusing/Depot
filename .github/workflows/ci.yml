name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    name: Build and publish
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build
        run: dotnet build Depot.slnx --configuration Release --no-restore -warnaserror

      - name: Restore win-x64 runtimes
        shell: pwsh
        run: |
          dotnet restore src/Depot/Depot.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/DepotManager/DepotManager.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Depot
        run: >-
          dotnet publish src/Depot/Depot.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish/depot

      - name: Publish DepotManager
        run: >-
          dotnet publish src/DepotManager/DepotManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish/manager

  test:
    name: Tests - ${{ matrix.area }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: Core
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Persistence
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Finance
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Security-Auth
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Sessions-Audit
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: DepotManager
            project: tests/DepotManager.Tests/DepotManager.Tests.csproj
          - area: Sales
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Purchasing
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Inventory-Warehouse
            project: tests/Depot.Tests/Depot.Tests.csproj
          - area: Shell-UX
            project: tests/Depot.Tests/Depot.Tests.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked dependencies
        run: dotnet restore Depot.slnx --locked-mode

      - name: Build test area
        run: dotnet build ${{ matrix.project }} --configuration Release --no-restore -warnaserror

      - name: Run regression area
        shell: pwsh
        run: ./scripts/quality/run-test-area.ps1 -Area '${{ matrix.area }}' -Configuration Release -NoBuild
