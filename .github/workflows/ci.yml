name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Depot.slnx

      - name: Build
        run: dotnet build Depot.slnx --configuration Release --no-restore

      - name: Sales tests
        run: dotnet test tests/Depot.Tests/Depot.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Sales" --blame-hang --blame-hang-timeout 90s --logger "console;verbosity=normal"

      - name: Regression tests
        run: dotnet test tests/Depot.Tests/Depot.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName!~Sales" --blame-hang --blame-hang-timeout 120s --logger "console;verbosity=normal"

      - name: Release single-file publish
        run: >-
          dotnet publish src/Depot/Depot.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish/win-x64
